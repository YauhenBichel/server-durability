name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: restic, for the tests that back up and restore for real
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic && restic version
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
      - name: one static binary, and the demo on a real Linux machine
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/server-durability ./cmd/server-durability
          SD=/tmp/server-durability bash examples/demo.sh
